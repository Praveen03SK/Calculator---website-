<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Calculator</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #334155);
        }

        .calculator {
            width: 340px;
            padding: 20px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .calculator h2 {
            text-align: center;
            color: white;
            margin-bottom: 15px;
        }

        #display {
            width: 100%;
            height: 75px;
            border: none;
            outline: none;
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 15px;
            text-align: right;
            font-size: 30px;
            background: #f8fafc;
            color: #111827;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            background: #475569;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background: #64748b;
        }

        .operator {
            background: #0ea5e9;
        }

        .operator:hover {
            background: #0284c7;
        }

        .clear {
            background: #ef4444;
        }

        .clear:hover {
            background: #dc2626;
        }

        .equal {
            background: #22c55e;
            grid-row: span 2;
            height: 130px;
        }

        .equal:hover {
            background: #16a34a;
        }

        .zero {
            grid-column: span 2;
        }

    </style>
</head>

<body>

<div class="calculator">

    <h2>🧮 Calculator</h2>

    <input type="text" id="display" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>

        <button onclick="deleteLast()">⌫</button>

        <button class="operator" onclick="addValue('%')">%</button>

        <button class="operator" onclick="addValue('/')">÷</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>

        <button class="operator" onclick="addValue('*')">×</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>

        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>

        <button class="operator" onclick="addValue('+')">+</button>

        <button class="zero" onclick="addValue('0')">0</button>

        <button onclick="addValue('.')">.</button>

        <button class="equal" onclick="calculate()">=</button>

    </div>

</div>

<script>

    const display = document.getElementById("display");

    function addValue(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = "";
    }

    function deleteLast() {
        display.value =
            display.value.slice(0, -1);
    }

    function calculate() {

        try {

            if (display.value === "") {
                return;
            }

            display.value =
                eval(display.value);

        } catch (error) {

            display.value = "Error";

            setTimeout(() => {
                display.value = "";
            }, 1000);
        }
    }

    // Keyboard support

    document.addEventListener("keydown", function(event) {

        const key = event.key;

        if (
            (key >= "0" && key <= "9") ||
            key === "+" ||
            key === "-" ||
            key === "*" ||
            key === "/" ||
            key === "." ||
            key === "%"
        ) {
            addValue(key);
        }

        else if (key === "Enter") {
            calculate();
        }

        else if (key === "Backspace") {
            deleteLast();
        }

        else if (key === "Escape") {
            clearDisplay();
        }

    });

</script>

</body>
</html>
